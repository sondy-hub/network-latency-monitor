name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: network_monitor_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      RUN_DB_INTEGRATION_TESTS: "1"
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: test_password
      TEST_DB_NAME: network_monitor_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize test database
        run: |
          python - <<'PY'
          import os
          import mysql.connector

          connection = mysql.connector.connect(
              host=os.environ["TEST_DB_HOST"],
              port=int(os.environ["TEST_DB_PORT"]),
              user=os.environ["TEST_DB_USER"],
              password=os.environ["TEST_DB_PASSWORD"],
              database=os.environ["TEST_DB_NAME"],
          )

          cursor = connection.cursor()
          cursor.execute("""
              CREATE TABLE IF NOT EXISTS ping_records (
                  id INT NOT NULL AUTO_INCREMENT,
                  timestamp DATETIME NOT NULL,
                  latency_ms FLOAT DEFAULT NULL,
                  PRIMARY KEY (id)
              )
          """)
          connection.commit()
          cursor.close()
          connection.close()
          PY

      - name: Run pytest
        run: python -m pytest -v
